# Only IO and startup differences belong here. NMPC, WBC, gait, stand-up gains,
# control rates and speed limits are inherited from controllers.yaml, which is
# also consumed by fortress.launch.py.
controller_manager:
  ros__parameters:
    use_sim_time: false

nmpc_wbc_controller:
  ros__parameters:
    use_sim_time: false
    hardware_mode: real
    use_sim_ground_truth: false
    legacy_joy_layout: true
    simulation_passive_hold: false
    # Hardware needs no allowance for simulated contact penetration.
    joint_limit_tolerance_rad: 0.005
