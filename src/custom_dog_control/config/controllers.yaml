controller_manager:
  ros__parameters:
    use_sim_time: true
    update_rate: 1000

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    nmpc_wbc_controller:
      type: custom_dog_control/NmpcWbcController

nmpc_wbc_controller:
  ros__parameters:
    use_sim_time: true
    joints:
      - FR_hip_joint
      - FR_thigh_joint
      - FR_calf_joint
      - FL_hip_joint
      - FL_thigh_joint
      - FL_calf_joint
      - RR_hip_joint
      - RR_thigh_joint
      - RR_calf_joint
      - RL_hip_joint
      - RL_thigh_joint
      - RL_calf_joint
    hardware_mode: gazebo
    legacy_joy_y_right: true
    # Shared NMPC/WBC profile for hardware and Fortress motor-PD physics.
    # Truth is available to independent simulation evaluation only.
    use_sim_ground_truth: false
    ground_truth_timeout_s: 0.10
    # Disabled for hardware until AHRS/gyro alignment has been checked. Fortress
    # can override this to evaluate bounded prediction with synchronized IMU data.
    imu_orientation_prediction_max_s: 0.0
    mpc_frequency_hz: 50.0
    mpc_solver_threads: 2
    # Full diagonal Trot cycle; each swing lasts 0.20 s without support overlap.
    trot_period_s: 0.40
    simulation_policy_timeout_cycles: 2.0
    command_timeout_s: 0.30
    joy_timeout_s: 0.30
    # Prevent NMPC from chasing a velocity trajectory far ahead of the
    # measured robot. Braking and zero commands bypass this acceleration lead.
    max_reference_lead_xy_m_s: 0.20
    max_reference_lead_yaw_rad_s: 0.40
    trot_entry_dwell_s: 0.15
    trot_exit_dwell_s: 0.30
    # Joint-side gains shared by real hardware and motor-PD physics.
    # The calf has an extra fixed 2:1 gear stage; tune its tracking separately.
    # These gains still pass through the common sampled effort boundary.
    stand_up_duration_s: 2.50
    stand_up_settle_duration_s: 2.0
    stand_up_hip_kp: 60.0
    stand_up_leg_kp: 60.0
    stand_up_calf_kp: 90.0
    stand_up_kd: 2.0
    stand_up_settle_hip_kp: 60.0
    stand_up_settle_leg_kp: 60.0
    stand_up_settle_calf_kp: 90.0
    stand_up_settle_kd: 2.0
    # Do not hand off with the ~0.32/0.38 rad rear-calf errors seen on hardware.
    stand_up_position_tolerance_rad: 0.20
    stand_up_velocity_tolerance_rad_s: 0.20
    stand_up_base_velocity_tolerance_m_s: 0.05
    handoff_duration_s: 2.0
    # Joint-side impedance for MPC_STANCE/TROT, shared by hardware and simulation.
    # Firmer motion impedance: Kp 60/60/90, Kd=2.0; validate motion after retuning.
    # Stand-up and settling retain their independently configured gains above.
    wbc_joint_stiffness: 60.0
    wbc_hip_stiffness: 60.0
    wbc_calf_stiffness: 90.0
    wbc_joint_damping: 2.0
    # Shape the velocity input shared by WBC and motor PD; positions stay raw.
    wbc_joint_velocity_acceleration_limit: 400.0
    # Add bounded Kpz*(nominal_z-policy_z) to the existing base-height task.
    wbc_nominal_height_correction_limit_mps2: 2.0
    # Retain bounded perpendicular position feedback without integrating an
    # along-command path; the bound applies in the estimator's coordinates.
    nmpc_cross_track_position_error_limit_m: 0.04
    # Real motor/contact latency is not identified. Default Fortress derives
    # confidence timing from its configured motor delay; custom files keep it.
    estimator_planned_contact_delay_s: 0.0
    estimator_planned_contact_ramp_s: 0.0
    # Signed FF+PD delivery-window model stays opt-in: motion regression has not
    # passed and actual contact acceleration exceeds the current envelope.
    # Real delivery time is unidentified; Fortress also preserves these values.
    motor_pd_budget_horizon_s: 0.0
    motor_pd_nominal_execution_time_s: 0.0
    # Experimental fixed-effort execution mode; regression required before use.
    # Locomotion motor Kp/Kd become zero; host raw/sent totals stay observable.
    host_total_torque_command: false
    wbc_nominal_joint_reference: false
    wbc_use_joint_acceleration_decision: false
    # Preserve enough hip-abduction authority for lateral stabilization at
    # full speed while staying well inside the URDF's +/-1.047 rad limit.
    locomotion_max_hip_angle_rad: 0.65
    # NMPC itself has no joint-limit constraint. Keep its posture target far
    # enough inside the URDF bounds to absorb swing-leg tracking inertia.
    locomotion_joint_limit_margin_rad: 0.15
    # Emergency guard only; normal zero-velocity stance remains world-locked.
    stance_reanchor_distance_m: 1.0
    max_consecutive_wbc_failures: 5
    # Base-frame origin above flat ground; not underside ground clearance.
    nominal_height_m: 0.34
    # Simulation-only passive damping. Real hardware overrides this value.
    safe_damping: 0.5
    simulation_passive_hold: true
    # Low gains are intentional: the folded calf pose is only 1 deg from its
    # lower limit, and the effort controller must not fight Gazebo contact.
    simulation_passive_hip_kp: 20.0
    simulation_passive_leg_kp: 60.0
    simulation_passive_kd: 0.35
    # Initial common low-speed envelope used by physics acceptance.
    velocity_limit_x: 0.05
    velocity_limit_y: 0.05
    velocity_limit_yaw: 0.20
    acceleration_limit_xy: 0.2
    acceleration_limit_yaw: 1.0
    # Gazebo can push the folded, ground-contacting calf about 1.2 deg through
    # its limit while unfolding. This does not change URDF or target bounds.
    joint_limit_tolerance_rad: 0.035
    nominal_joint_positions:
      # URDF IK: neutral hip angles, foot centers at z=0.026-0.34=-0.314 m,
      # x=+/-0.185 m and natural lateral offset y~=+/-0.1394 m.
      [0.0, 0.716130233, -1.454294645,
       0.0, 0.715821774, -1.454461972,
       0.0, 0.715631114, -1.454556830,
       0.0, 0.713540237, -1.455606346]
    # Static gravity/contact compensation for the 15.15 kg model at this pose:
    # q_target=q_nominal+(g-J^T*f)/Kp, with settle Kp=60/60/90.
    # Contact forces balance the floating-base wrench; this is a model estimate.
    stand_up_joint_positions:
      [0.037211552, 0.720521938, -1.401114627,
      -0.037725925, 0.720229885, -1.400835219,
       0.042377004, 0.720018873, -1.395839320,
      -0.042684870, 0.717913594, -1.396568930]
    # Gazebo collision-settled prone pose. The real hardware START operation
    # independently maps its current physical prone pose to logical hip=0.
    passive_joint_positions:
      [-0.5672320069, 1.2535642999, -2.8239427297,
        0.5672320069, 1.2535642999, -2.8239427297,
       -0.5672320069, 1.2535642999, -2.8239427297,
        0.5672320069, 1.2535642999, -2.8239427297]
