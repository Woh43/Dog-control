# 仿真与真机共用的 NMPC/WBC 控制参数；当前 ROS 2 控制链路不使用 RL。
# real.launch.py 先读本文件，再按节点参数覆盖 real_controller.yaml；未覆盖项继续继承这里。
# Fortress 可用 controllers_file 选择完整配置，并继续施加显式 launch 覆盖；运行值应以启动参数为准。
# 仿真 IMU 频率、额外电机延迟和关节摩擦在 fortress.launch.py 中配置，不由本文件设置。
# task.info 另管 NMPC Q/R、求解设置及 WBC 任务空间 PD/权重，勿与下面的关节 PD 混淆。
controller_manager:
  ros__parameters:
    # 管理器使用仿真 /clock；真机覆盖为 false，使用系统时钟。
    use_sim_time: true
    # 主控 read→update→write 的目标频率，单位 Hz；WBC 每个有效运动控制周期求解一次。
    update_rate: 1000

    # 发布关节反馈的标准 ROS 2 控制器插件。
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    # 本项目的 NMPC/WBC 控制器插件类型。
    nmpc_wbc_controller:
      type: custom_dog_control/NmpcWbcController

nmpc_wbc_controller:
  ros__parameters:
    # 控制器时钟；launch 保证与对应管理器/后端的时间基准一致。
    use_sim_time: true
    # 硬件顺序固定为 FR 右前、FL 左前、RR 右后、RL 左后；每腿依次髋外展、大腿、小腿。
    joints:
      - FR_hip_joint
      - FR_thigh_joint
      - FR_calf_joint
      - FL_hip_joint
      - FL_thigh_joint
      - FL_calf_joint
      - RR_hip_joint
      - RR_thigh_joint
      - RR_calf_joint
      - RL_hip_joint
      - RL_thigh_joint
      - RL_calf_joint
    # 控制器接口类型；Fortress launch 会覆盖为 fortress_hybrid，真机 launch 强制为 real。
    hardware_mode: gazebo
    # 仅普通手柄布局的横移轴使用旧 y 向右约定，并转换到 REP-103 的 y 向左；不切换整套按键布局。
    legacy_joy_y_right: true
    # false：控制反馈使用 IMU＋关节运动学估计；仿真物理真值仅供独立评测。真机强制 false。
    use_sim_ground_truth: false
    # 仅开启仿真真值反馈时生效：真值消息最大允许年龄，单位 s。
    ground_truth_timeout_s: 0.10
    # 新鲜 IMU 姿态按已知主机消息年龄，用陀螺仪前推的最长时间，单位 s；0 关闭。
    # 真机 AHRS/陀螺仪对齐尚未验证；这不是假设设备内部延迟的补偿，Fortress 可从 launch 覆盖。
    imu_orientation_prediction_max_s: 0.0
    # 后台 NMPC 求解节拍，单位 Hz；WBC 随上面的 update_rate 执行。Fortress launch 可覆盖。
    mpc_frequency_hz: 50.0
    # NMPC 的 SQP 求解线程数；Fortress launch 可覆盖。频率与线程数都不保证板载实时性能。
    mpc_solver_threads: 2
    # 完整对角 Trot 周期，单位 s；当前无四足支撑重叠，每组对角腿摆动约 0.20 s。
    # 实际步态由后端按此参数生成；config/nmpc/gait.info 不控制当前速度链路的周期。
    trot_period_s: 0.40
    # 仿真策略最大年龄＝此周期数/mpc_frequency_hz，当前 0.040 s；真机固定两周期，不读此项。
    simulation_policy_timeout_cycles: 2.0
    # /cmd_vel 最大有效年龄，单位 s；超时后目标归零，再按加速度限制减速。
    command_timeout_s: 0.30
    # 手柄速度与模式请求最大有效年龄，单位 s；有偏转且新鲜的手柄速度优先于 /cmd_vel。
    joy_timeout_s: 0.30
    # NMPC 的 vx/vy 参考最多领先同向估计速度的幅值，单位 m/s；减速和零指令直接通过。
    # 与按时间限制速度变化的 acceleration_limit_xy 分属两道限制。
    max_reference_lead_xy_m_s: 0.20
    # NMPC 偏航角速度参考相对同向估计角速度的领先上限，单位 rad/s。
    max_reference_lead_yaw_rad_s: 0.40
    # 达到进入 Trot 的速度阈值后需持续的时间，单位 s；随后还须等新策略确认对角接触模式。
    trot_entry_dwell_s: 0.15
    # 满足停车条件后需持续的时间，单位 s；随后还须等新策略确认四足支撑，才退出 Trot。
    trot_exit_dwell_s: 0.30
    # 起身位置插值时间，单位 s；从进入起身时的实测关节角平滑过渡到 stand_up_joint_positions。
    # 以下 Kp/Kd 均为关节输出侧增益：Kp 单位 N·m/rad，Kd 单位 N·m·s/rad；会经过采样力矩预算缩放。
    # 小腿含额外固定 2:1 传动；这里不是电机转子侧增益。起身阶段 FF=0，依靠位置 PD 执行。
    stand_up_duration_s: 2.50
    # 起身插值结束后，向稳定站立增益平滑过渡的时间，单位 s；时间到达并不单独触发 WBC 接管。
    stand_up_settle_duration_s: 2.0
    # 起身阶段髋外展关节 Kp。
    stand_up_hip_kp: 60.0
    # 起身阶段大腿关节 Kp；此处 leg 指大腿，不含小腿。
    stand_up_leg_kp: 60.0
    # 起身阶段小腿关节 Kp。
    stand_up_calf_kp: 90.0
    # 起身阶段十二个关节共同使用的 Kd。
    stand_up_kd: 2.0
    # 稳定起身/首次接管混合所用髋外展 Kp；默认模式下 WBC 短暂失败回退也使用这组增益。
    stand_up_settle_hip_kp: 60.0
    # 稳定起身的大腿 Kp。
    stand_up_settle_leg_kp: 60.0
    # 稳定起身的小腿 Kp。
    stand_up_settle_calf_kp: 90.0
    # 稳定起身十二关节共同使用的 Kd。
    stand_up_settle_kd: 2.0
    # 允许进入 MPC_STANCE 的逐关节位置误差上限，单位 rad；比较对象是 stand_up_joint_positions。
    stand_up_position_tolerance_rad: 0.20
    # 起身交接所需的逐关节速度绝对值上限，单位 rad/s。
    stand_up_velocity_tolerance_rad_s: 0.20
    # 起身交接所需的估计机身三维线速度模长上限，单位 m/s；还需估计有效且站立策略可用。
    stand_up_base_velocity_tolerance_m_s: 0.05
    # 首次起身 PD→MPC_STANCE/WBC 混合交接时间，单位 s；Trot 停车后不重复此固定站姿混合。
    handoff_duration_s: 2.0
    # MPC_STANCE/TROT 大腿关节 Kp，单位 N·m/rad；名称含 joint，但髋和小腿由下两项单独设置。
    # 这是执行器关节 PD，与 task.info 中足端/机身任务空间 PD、QP 任务权重不同。
    wbc_joint_stiffness: 60.0
    # MPC_STANCE/TROT 髋外展关节 Kp，单位 N·m/rad。
    wbc_hip_stiffness: 60.0
    # MPC_STANCE/TROT 小腿关节 Kp，单位 N·m/rad。
    wbc_calf_stiffness: 90.0
    # MPC_STANCE/TROT 十二关节共同使用的 Kd，单位 N·m·s/rad。
    wbc_joint_damping: 2.0
    # 关节速度目标的变化率上限，单位 rad/s²；同一整形后 dq 供 WBC 和电机 PD 使用。
    # 默认路径仅整形 dq，q 仍来自策略并受安全投影，不保证整形后的 dq 是 q 的严格时间导数。
    wbc_joint_velocity_acceleration_limit: 400.0
    # WBC 机身高度任务额外修正的绝对值上限，单位 m/s²；修正为
    # 限幅后的 Kpz×(nominal_height_m−策略高度)，仅加到机身垂直任务，不平移足端参考。
    wbc_nominal_height_correction_limit_mps2: 2.0
    # 运动参考保留的垂直于指令方向的位置误差上限，单位 m；沿指令方向不积分路径。
    # 坐标来自估计器；这是参考误差界，不是物理横漂保证。0 关闭该横向位置记忆。
    nmpc_cross_track_position_error_limit_m: 0.04
    # 估计器在规划“落地”后延后采纳支撑约束的时间，单位 s；不是足底传感器测量或已辨识延迟。
    # 默认 Fortress 按 launch 的电机延迟覆盖：当前此项 0.020 s、下一项 0.010 s；
    # 显式 controllers_file 的自定义配置保留文件值，除非给对应 launch 覆盖。真机继承这里的 0/0。
    estimator_planned_contact_delay_s: 0.0
    # 上述延后结束后，支撑置信度由 0 平滑增至 1 的时间，单位 s；0 表示直接切换。
    estimator_planned_contact_ramp_s: 0.0
    # 实验性有符号 FF＋PD 执行窗口预算的时域 H，单位 s；0 不启用预测窗口，保留现有采样预算。
    # 窗口依赖假设的关节加速度界；实机延迟未辨识，运动回归未通过，不能当作执行时总力矩保证。
    motor_pd_budget_horizon_s: 0.0
    # 上述窗口的名义执行时刻 D，单位 s，要求 0≤D≤H；用于预测名义 PD，不是额外物理延迟。
    motor_pd_nominal_execution_time_s: 0.0
    # 实验性主机合成并限幅总力矩：运动阶段发送 Kp=Kd=0 的固定力矩包；false 保留电机侧 FF＋PD。
    # 开启时要求 H=D=0；目前默认关闭，不能视为已经解决延迟下的总力矩预算。
    host_total_torque_command: false
    # 实验性同策略/同时间的名义 q/dq 成对采样；true 时共同绕过 dq 单独整形，安全投影仍保留。
    # false 保留当前策略评估路径；该开关不等于 nominal_joint_positions 是否被用作 NMPC 姿态参考。
    wbc_nominal_joint_reference: false
    # 实验性将 QP 关节加速度变量耦合到机身质心动量率任务；false 保留由 dq 差分形成的原任务。
    wbc_use_joint_acceleration_decision: false
    # 运动髋外展目标角绝对值上限，单位 rad；在 URDF 关节范围内再取交集。
    locomotion_max_hip_angle_rad: 0.65
    # 运动 q 参考相对 URDF 上下限向内收缩的裕量，单位 rad；越界目标会投影，且对应 dq 置零。
    # 这不是 NMPC 内部约束，也不同于 task.info/jointLimitsTask 的 WBC 预测制动裕量和下面的测量容差。
    locomotion_joint_limit_margin_rad: 0.15
    # 零速 MPC_STANCE 估计位置离站立锚点达到此距离时应急重锚，单位 m；正常站立保持世界锚点。
    stance_reanchor_distance_m: 1.0
    # WBC 连续无效的控制周期数达到此值进入 FAULT；成功一次清零计数，阈值前短暂回退站姿 PD。
    max_consecutive_wbc_failures: 5
    # 平地上 base 坐标原点的目标高度，单位 m；不是机腹离地间隙。用于 NMPC 高度参考、WBC 高度修正及估计初始化。
    # 不会自动重算下面两组关节角；修改高度时需同时核查名义姿态和起身补偿姿态。
    nominal_height_m: 0.34
    # 安全输出的关节 Kd，单位 N·m·s/rad；仿真不启用趴姿保持时使用。
    # 真机 YAML 并未覆盖此值；硬件层另有 safe_damping=1.0，但常规 PASSIVE/CALIBRATION/FAULT 关闭 motion_enabled，
    # 发送停止包，不应把本参数或硬件层阻尼解释为真机这些状态下持续执行的 Kd。
    safe_damping: 0.5
    # 仅仿真 PASSIVE 用下方增益保持 passive_joint_positions；真机覆盖为 false。
    simulation_passive_hold: true
    # 仿真趴姿保持的髋外展 Kp，单位 N·m/rad；折叠姿态接近碰撞与限位，使用独立低增益。
    simulation_passive_hip_kp: 20.0
    # 仿真趴姿保持的大腿和小腿 Kp，单位 N·m/rad。
    simulation_passive_leg_kp: 60.0
    # 仿真趴姿保持的十二关节 Kd，单位 N·m·s/rad。
    simulation_passive_kd: 0.35
    # 指令机身前后速度绝对值上限，单位 m/s；当前公共配置是低速验收范围，高速试验用独立配置放开。
    velocity_limit_x: 0.05
    # 指令机身左右速度绝对值上限，单位 m/s；REP-103 规定 y 正方向向左。
    velocity_limit_y: 0.05
    # 指令偏航角速度绝对值上限，单位 rad/s；它们限制命令，不等于实测超速保护阈值。
    velocity_limit_yaw: 0.20
    # 对 vx、vy 分别限制的指令变化率，单位 m/s²；超时停车同样经过此斜坡。
    acceleration_limit_xy: 0.2
    # 偏航角速度指令变化率上限，单位 rad/s²。
    acceleration_limit_yaw: 1.0
    # 关节实测角越过 URDF 边界的保护容差，单位 rad；不是允许目标越界。
    # 仿真折叠腿展开时允许少量接触穿透误差；真机覆盖为 0.005 rad。
    joint_limit_tolerance_rad: 0.035
    # 运行 NMPC 的名义关节姿态参考，单位 rad；顺序固定 FR、FL、RR、RL，每腿依次髋外展、大腿、小腿。
    # URDF 逆运动学名义构型：髋角 0，足心相对 base 的 z=0.026−0.34=−0.314 m，
    # x≈±0.185 m、自然横向偏置 y≈±0.1394 m；后端按关节名映射到模型顺序。
    nominal_joint_positions:
      [0.0, 0.716130233, -1.454294645,
       0.0, 0.715821774, -1.454461972,
       0.0, 0.715631114, -1.454556830,
       0.0, 0.713540237, -1.455606346]
    # 起身 PD 的位置目标，单位 rad，顺序同上；与名义构型不同，预先加入静力偏置：
    # q_target=q_nominal+(g−Jᵀf)/Kp，按 15.15 kg 模型及稳定 Kp=60/60/90 估算。
    # 这是以位置偏置产生的重力/支撑补偿，不是额外 FF；改质量、姿态或稳定 Kp 后需复核，程序不会自动重算。
    stand_up_joint_positions:
      [0.037211552, 0.720521938, -1.401114627,
      -0.037725925, 0.720229885, -1.400835219,
       0.042377004, 0.720018873, -1.395839320,
      -0.042684870, 0.717913594, -1.396568930]
    # 仿真碰撞沉降后的趴姿保持角，单位 rad，顺序同上。
    # 真机 START 标定会独立把实际趴姿映射到逻辑关节坐标，并不使用此仿真髋角作为真机标定角。
    passive_joint_positions:
      [-0.5672320069, 1.2535642999, -2.8239427297,
        0.5672320069, 1.2535642999, -2.8239427297,
       -0.5672320069, 1.2535642999, -2.8239427297,
        0.5672320069, 1.2535642999, -2.8239427297]
